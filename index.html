<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fitness Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🏃 Fitness Tracker</h1>
            <p>Track your daily fitness and monitor your progress</p>
        </header>


        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <h3>👟 Steps</h3>
                <h2 id="stepsDisplay">0</h2>
                <p>Today's Steps</p>
            </div>

            <div class="card">
                <h3>🏋️ Workout</h3>
                <h2 id="workoutDisplay">0</h2>
                <p>Minutes</p>
            </div>

            <div class="card">
                <h3>🔥 Calories</h3>
                <h2 id="caloriesDisplay">0</h2>
                <p>Calories Burned</p>
            </div>

            <div class="card">
                <h3>💧 Water</h3>
                <h2 id="waterDisplay">0</h2>
                <p>Glasses</p>
            </div>

        </section>


        <!-- Add Activity -->
        <section class="form-section">

            <h2>➕ Add Fitness Activity</h2>

            <form id="fitnessForm">

                <label for="activity">Exercise / Activity</label>
                <input
                    type="text"
                    id="activity"
                    placeholder="Example: Running"
                    required
                >

                <label for="duration">Workout Time (minutes)</label>
                <input
                    type="number"
                    id="duration"
                    placeholder="Example: 30"
                    min="0"
                    required
                >

                <label for="steps">Steps</label>
                <input
                    type="number"
                    id="steps"
                    placeholder="Example: 5000"
                    min="0"
                    required
                >

                <label for="calories">Calories Burned</label>
                <input
                    type="number"
                    id="calories"
                    placeholder="Example: 200"
                    min="0"
                    required
                >

                <label for="water">Water (glasses)</label>
                <input
                    type="number"
                    id="water"
                    placeholder="Example: 6"
                    min="0"
                    required
                >

                <label for="date">Date</label>
                <input
                    type="date"
                    id="date"
                    required
                >

                <button type="submit">Save Activity</button>

            </form>

        </section>


        <!-- Progress -->
        <section class="progress-section">

            <h2>📊 Weekly Progress</h2>

            <div class="chart-container">

                <div class="bar">
                    <span>Mon</span>
                    <div class="bar-fill" id="monBar"></div>
                </div>

                <div class="bar">
                    <span>Tue</span>
                    <div class="bar-fill" id="tueBar"></div>
                </div>

                <div class="bar">
                    <span>Wed</span>
                    <div class="bar-fill" id="wedBar"></div>
                </div>

                <div class="bar">
                    <span>Thu</span>
                    <div class="bar-fill" id="thuBar"></div>
                </div>

                <div class="bar">
                    <span>Fri</span>
                    <div class="bar-fill" id="friBar"></div>
                </div>

                <div class="bar">
                    <span>Sat</span>
                    <div class="bar-fill" id="satBar"></div>
                </div>

                <div class="bar">
                    <span>Sun</span>
                    <div class="bar-fill" id="sunBar"></div>
                </div>

            </div>

        </section>


        <!-- Saved Activities -->
        <section class="records-section">

            <h2>📝 Saved Activities</h2>

            <div id="activityList">
                <p>No activities recorded yet.</p>
            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>
</html>
